name: Terraform CI Pipeline

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: [self-hosted, amazonlinux, dev]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
